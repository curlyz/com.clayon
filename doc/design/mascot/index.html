<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mascot: Doc</title>
    <style>
      :root { --void: #120d09; --hull: #1a130e; --band: #241a13; --line: #3a2b20; --ink: #f1e6cf; --dim: #b09c80; --accent: #f2a93b; --live: #5fd3e0; --bad: #e0715a; }
      * { box-sizing: border-box; border-radius: 0; }
      html { font-family: "MonoLisa Nerd Font", "MonoLisa", monospace; font-size: 14px; line-height: 1.6; color: var(--ink); background: var(--void); }
      body { margin: 0; }
      main { max-width: 960px; margin: 0 auto; min-height: 100vh; background: var(--hull); border-inline: 2px solid var(--line); }
      h1, h2, p { margin: 0; }
      .head { background: var(--band); padding: 0.75rem 1.25rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; border-bottom: 2px solid var(--line); }
      .head h2 { font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
      .head h2::before { content: "> "; color: var(--accent); }
      .band { padding: 0.75rem 1.25rem; border-top: 2px solid var(--line); }
      .dim { color: var(--dim); } .live { color: var(--live); } .bad { color: var(--bad); }
      #stage { display: block; width: 100%; height: 260px; background: var(--void); image-rendering: pixelated; touch-action: none; cursor: default; }
      .btns { display: flex; flex-wrap: wrap; gap: 0.5rem; }
      button { font: inherit; color: var(--ink); background: var(--band); border: 2px solid var(--line); padding: 0.2rem 0.75rem; min-height: 2.25rem; cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); color: var(--void); border-color: var(--accent); font-weight: 700; }
      .frames { display: flex; flex-wrap: wrap; gap: 0.5rem; }
      .frame { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; padding: 0.5rem; border: 2px solid var(--line); font-size: 0.8rem; color: var(--dim); }
      .frame.on { border-color: var(--accent); color: var(--accent); }
      .frame canvas { image-rendering: pixelated; background: var(--void); }
      .row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.4rem 1.25rem; border-top: 2px solid var(--line); }
      #menu { position: fixed; display: none; z-index: 5; background: var(--hull); border: 2px solid var(--line); box-shadow: 4px 4px 0 var(--void); min-width: 11rem; }
      #menu button { display: block; width: 100%; text-align: left; border: 0; min-height: 2rem; }
      #menu button:hover { background: var(--band); }
      #bar { height: 0.5rem; background: var(--line); } #bar i { display: block; height: 100%; width: 0; background: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <div class="head"><h2>Doc, the mascot</h2><span class="dim" id="mode">idle</span></div>
      <canvas id="stage" aria-label="Doc, an animated pixel mascot. Hover, click, double click, drag, or right click."></canvas>
      <div id="bar"><i id="bar-fill"></i></div>

      <div class="head"><h2>try the mouse</h2></div>
      <div class="band"><p class="dim">Hover: Doc stops and faces you. Click: waves and hops. Double click: cheers. Drag: pick Doc up and drop. Right click or long press: menu. Press Enter on the stage to talk.</p></div>

      <div class="head"><h2>agent events (AG-UI)</h2></div>
      <div class="band btns" id="events"></div>
      <div class="row"><span class="dim">state</span><span id="state">mood idle</span></div>
      <div id="log"></div>

      <div class="head"><h2>the frames, drawn by hand, 16 by 18 pixels</h2></div>
      <div class="band frames" id="frames"></div>
    </main>
    <div id="menu"></div>

    <script>
      // Hand-drawn frames. Rows are 16 wide, 18 tall. Palette letters map below.

................

.jkhhsssesk.....

...kwwwwwwkcck..
...kwwowwwktttk.
...kwwwwwwksttk.
...kxxxxxxkttk..
...kwwwwwwk.....
...kbbbbbbbbk...`;
      const COLORS = { k: "#2a1a12", h: "#8a5a32", j: "#5e3a20", s: "#f0b890", e: "#1a1a2a", g: "#4aa8ff", y: "#c89a3a", w: "#e8dcc4", x: "#b9a98a", o: "#f08a2a", b: "#7a4a2a", t: "#9a6a3a", c: "#c9c9c9", p: "#f2c94c", z: "#ffffff" };
      const W = 16, H = 18, S = 10; // integer scale only

      const frames = {};
      FRAMES_TEXT.split("## ").filter(Boolean).forEach((block) => {
        const lines = block.trim().split("\n");
        frames[lines[0].trim()] = lines.slice(1);
      });
      // sleep1: the z's swap rows, so the sleeper breathes
      frames.sleep1 = [frames.sleep0[1], frames.sleep0[0], ...frames.sleep0.slice(2)];

      function draw(ctx, rows, x, y, scale, flip) {
        ctx.save();
        ctx.translate(Math.round(x), Math.round(y));
        if (flip) { ctx.translate(W * scale, 0); ctx.scale(-1, 1); }
        rows.forEach((row, r) => { for (let c = 0; c < W; c++) { const ch = row[c]; if (COLORS[ch]) { ctx.fillStyle = COLORS[ch]; ctx.fillRect(c * scale, r * scale, scale, scale); } } });
        ctx.restore();
      }

      // animations: frame names with seconds per frame
      const ANIMS = {
        idle: { names: ["idle0", "idle0", "idle1", "idle0"], fps: 2.2 },
        walk: { names: ["walk0", "walk1", "walk2", "walk3"], fps: 7 },
        work: { names: ["work0", "work1"], fps: 3 },
        happy: { names: ["happy0", "happy1"], fps: 5 },
        wait: { names: ["happy0", "idle0", "idle1", "idle0"], fps: 2.5 },
        sleep: { names: ["sleep0", "sleep1"], fps: 1 },
      };

      const stage = document.getElementById("stage");
      const ctx = stage.getContext("2d");
      const modeEl = document.getElementById("mode");
      const stateEl = document.getElementById("state");
      const logEl = document.getElementById("log");
      const barFill = document.getElementById("bar-fill");
      const menu = document.getElementById("menu");

      const m = { mode: "idle", t: 0, x: 120, y: 0, flip: false, target: null, until: 0, bubble: "", bubbleUntil: 0, hop: 0, held: false, dropV: 0, progress: 0, talking: false, thinking: false, tool: null, waiting: false, hover: false, wanderAt: 2 };
      let pointer = { x: -999, y: -999 };

      function resize() {
        const r = stage.getBoundingClientRect(); const dpr = Math.max(1, Math.floor(devicePixelRatio || 1));
        stage.width = Math.floor(r.width) * dpr; stage.height = Math.floor(r.height) * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.imageSmoothingEnabled = false;
      }
      addEventListener("resize", resize); resize();
      const groundY = () => stage.getBoundingClientRect().height - H * S - 24;
      m.y = groundY();

      function setMode(mode, secs) { m.mode = mode; m.t = 0; m.until = secs ? performance.now() / 1000 + secs : 0; modeEl.textContent = mode; }
      function say(text, secs) { m.bubble = text; m.bubbleUntil = performance.now() / 1000 + (secs || 2); }
      function log(type, effect) { const d = document.createElement("div"); d.className = "row"; d.innerHTML = '<span class="live">' + type + '</span><span class="dim">' + effect + "</span>"; logEl.prepend(d); }
      function renderState() { stateEl.textContent = "mood " + m.mode + " · talking " + m.talking + " · thinking " + m.thinking + " · tool " + (m.tool || "none") + " · progress " + Math.round(m.progress * 100) + "% · waiting " + m.waiting; barFill.style.width = m.progress * 100 + "%"; }

      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000); last = now; const sec = now / 1000;
        m.t += dt; const gy = groundY(); const w = stage.getBoundingClientRect().width;
        if (m.until && sec > m.until) { m.until = 0; if (m.mode === "happy" || m.mode === "walk") setMode("idle"); }
        if (!m.held) {
          // wander, unless the pointer is on Doc or Doc is busy
          if (m.mode === "idle" && !m.hover && !m.waiting && sec > m.wanderAt) { m.target = 40 + Math.random() * (w - W * S - 80); setMode("walk"); }
          if (m.mode === "walk") {
            if (m.hover) { setMode("idle"); m.target = null; }
            else if (m.target !== null) { const dx = m.target - m.x; m.flip = dx < 0; m.x += Math.sign(dx) * 70 * dt; if (Math.abs(dx) < 3) { m.target = null; setMode("idle"); m.wanderAt = sec + 2 + Math.random() * 3; } }
          }
          if (m.mode === "idle" && m.hover) m.flip = pointer.x < m.x + (W * S) / 2;
          // gravity after a drop, hop arcs
          if (m.y < gy) { m.dropV += 900 * dt; m.y = Math.min(gy, m.y + m.dropV * dt); if (m.y >= gy) { m.dropV = 0; setMode("idle"); say("ow", 1); } }
          else m.y = gy;
        }
        const a = ANIMS[m.mode] || ANIMS.idle; const fname = a.names[Math.floor(m.t * a.fps) % a.names.length];
        let hop = 0; if (m.hop > 0) { m.hop = Math.max(0, m.hop - dt * 1.4); hop = Math.sin(m.hop * Math.PI) * 46; }
        const px = Math.min(Math.max(m.x, 0), w - W * S);
        ctx.clearRect(0, 0, w, stage.getBoundingClientRect().height);
        ctx.fillStyle = "#3a2b20"; ctx.fillRect(0, gy + H * S - 2, w, 4); // ground
        ctx.fillStyle = "#0d0906"; ctx.fillRect(px + 2 * S, gy + H * S - 6, 12 * S, 6); // pixel shadow
        const drawY = m.held ? m.y : m.y - hop;
        draw(ctx, frames[m.held ? "happy1" : fname], px, drawY, S, m.flip);
        // speech bubble: square, pixel font stays the UI mono
        const text = m.waiting ? "needs you" : m.talking ? m.bubble : m.thinking ? "thinking..." : m.tool ? m.tool : sec < m.bubbleUntil ? m.bubble : "";
        if (text) { ctx.font = "14px MonoLisa Nerd Font, MonoLisa, monospace"; const tw = Math.ceil(ctx.measureText(text).width) + 16; const bx = Math.min(Math.max(px + (W * S) / 2 - tw / 2, 4), w - tw - 4); const by = drawY - 14; ctx.fillStyle = "#f1e6cf"; ctx.fillRect(bx, by - 22, tw, 24); ctx.fillStyle = "#120d09"; ctx.fillText(text, bx + 8, by - 5); }
        m.rect = { x: px, y: drawY, w: W * S, h: H * S };
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      // mouse and touch
      const inRect = (x, y) => m.rect && x >= m.rect.x && x <= m.rect.x + m.rect.w && y >= m.rect.y && y <= m.rect.y + m.rect.h;
      const local = (e) => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
      let drag = null, pressTimer = 0;
      stage.addEventListener("pointermove", (e) => {
        const p = local(e); pointer = p; m.hover = inRect(p.x, p.y); stage.style.cursor = m.hover ? (m.held ? "grabbing" : "grab") : "default";
        if (drag) { if (!m.held && Math.hypot(p.x - drag.x, p.y - drag.y) > 5) { m.held = true; clearTimeout(pressTimer); setMode("happy"); } if (m.held) { m.x = p.x - (W * S) / 2; m.y = p.y - (H * S) / 2; } }
      });
      stage.addEventListener("pointerleave", () => { m.hover = false; });
      stage.addEventListener("pointerdown", (e) => { if (e.button !== 0) return; const p = local(e); if (!inRect(p.x, p.y)) return; drag = p; stage.setPointerCapture(e.pointerId); pressTimer = setTimeout(() => { if (!m.held) { openMenu(e.clientX, e.clientY); drag = null; } }, 600); });
      stage.addEventListener("pointerup", () => { clearTimeout(pressTimer); if (m.held) { m.held = false; m.dropV = 0; setMode("happy", 0.8); } else if (drag) { say("hi!", 1.6); m.hop = 1; setMode("happy", 1.2); } drag = null; });
      stage.addEventListener("dblclick", (e) => { const p = local(e); if (inRect(p.x, p.y)) { say("woo!", 2.4); m.hop = 1; setMode("happy", 2.4); } });
      stage.addEventListener("contextmenu", (e) => { e.preventDefault(); const p = local(e); if (inRect(p.x, p.y)) openMenu(e.clientX, e.clientY); });
      stage.tabIndex = 0; stage.addEventListener("keydown", (e) => { if (e.key === "Enter") { say("what do you need?", 2.4); m.hop = 0.6; } });
      function openMenu(x, y) {
        menu.innerHTML = "";
        [["work", () => setMode("work")], ["cheer", () => { m.hop = 1; setMode("happy", 2); }], ["take a nap", () => setMode("sleep")], ["wake up", () => setMode("idle")]].forEach(([label, fn]) => { const b = document.createElement("button"); b.textContent = label; b.onclick = () => { menu.style.display = "none"; fn(); }; menu.appendChild(b); });
        menu.style.left = Math.min(x, innerWidth - 190) + "px"; menu.style.top = Math.min(y, innerHeight - 170) + "px"; menu.style.display = "block";
      }
      addEventListener("pointerdown", (e) => { if (!menu.contains(e.target)) menu.style.display = "none"; });

      // AG-UI events: each one drives Doc the way the live stream would
      const words = ["Checking", "the", "invoice", "table", "for", "outliers", "and", "grouping", "by", "plan."];
      const EVENTS = {
        RUN_STARTED: ["arrives, starts working", () => { m.waiting = false; m.progress = 0; setMode("work"); say("on it", 1.6); m.hop = 1; }],
        TEXT_MESSAGE_START: ["talking on", () => { m.talking = true; m.bubble = ""; }],
        TEXT_MESSAGE_CONTENT: ["bubble streams a word", () => { m.talking = true; m.bubble = (m.bubble + " " + words[Math.floor(Math.random() * words.length)]).trim().split(" ").slice(-4).join(" "); }],
        TEXT_MESSAGE_END: ["talking off", () => setTimeout(() => { m.talking = false; renderState(); }, 1200)],
        TOOL_CALL_START: ["uses the clipboard", () => { m.tool = "using clipboard"; setMode("work"); }],
        TOOL_CALL_ARGS: ["tool pulse", () => { m.hop = 0.3; }],
        TOOL_CALL_END: ["tool off", () => { m.tool = null; }],
        TOOL_CALL_RESULT: ["nods", () => { m.hop = 0.5; say("got it", 1.2); }],
        REASONING_START: ["thinking on", () => { m.thinking = true; setMode("idle"); }],
        REASONING_END: ["thinking off", () => { m.thinking = false; }],
        STATE_SNAPSHOT: ["progress from todos", () => { m.progress = 0.25; }],
        STATE_DELTA: ["progress advances", () => { m.progress = Math.min(1, m.progress + 0.25); }],
        ACTIVITY_SNAPSHOT: ["micro-loop: working", () => { setMode("work"); }],
        INTERRUPT: ["blocked on you: raises a hand", () => { m.waiting = true; setMode("wait"); }],
        RUN_FINISHED: ["cheers for 4 seconds", () => { m.waiting = false; m.tool = null; m.thinking = false; m.talking = false; m.progress = 1; m.hop = 1.3; say("done!", 3); setMode("happy", 4); }],
        RUN_ERROR: ["slumps and sleeps", () => { m.waiting = false; m.tool = null; m.thinking = false; m.talking = false; say("zzz", 3); setMode("sleep"); }],
        RAW: ["no animation, logged only", () => {}],
      };
      const evBox = document.getElementById("events");
      Object.keys(EVENTS).forEach((type) => { const b = document.createElement("button"); b.textContent = type; b.onclick = () => { EVENTS[type][1](); log(type, EVENTS[type][0]); renderState(); }; evBox.appendChild(b); });
      const approve = document.createElement("button"); approve.className = "primary"; approve.textContent = "approve (releases a waiting Doc)"; approve.onclick = () => { if (m.waiting) { m.waiting = false; setMode("work"); say("thanks", 1.6); log("sign-off", "approved, Doc continues"); renderState(); } }; evBox.appendChild(approve);
      renderState();

      // the frames strip: every frame, drawn at 4x, current one highlighted
      const strip = document.getElementById("frames"); const thumbs = {};
      Object.keys(frames).forEach((name) => { const d = document.createElement("div"); d.className = "frame"; const c = document.createElement("canvas"); c.width = W * 4; c.height = H * 4; draw(c.getContext("2d"), frames[name], 0, 0, 4, false); d.appendChild(c); d.appendChild(document.createTextNode(name)); strip.appendChild(d); thumbs[name] = d; });
      setInterval(() => { const a = ANIMS[m.mode] || ANIMS.idle; const f = a.names[Math.floor(m.t * a.fps) % a.names.length]; Object.keys(thumbs).forEach((n) => thumbs[n].classList.toggle("on", n === f)); }, 80);
    </script>
  </body>
</html>
