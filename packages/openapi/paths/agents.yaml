get:
  operationId: listAgents
  summary: The agent roster of one company
  description: >-
    Agents of the given company, newest first, at most the limit. The read model
    is the stable roster subset of the agents table; no config or secret field
    ever reaches the wire.
  parameters:
    - name: companyId
      in: query
      required: true
      description: The company whose agents are listed.
      schema:
        type: string
        format: uuid
    - name: limit
      in: query
      required: false
      description: Maximum agents returned, 1 to 100, default 20.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    '200':
      description: The agent roster, newest first
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentList.yaml
